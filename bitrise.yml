format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android
workflows:
  assemble:
    description: >-
      Base workflow for building Android apps.
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@7: {}
      - cache-pull@2: {}
      - generate-text-file@0:
          inputs:
            - file_content: |-
                kotlin.code.style=official
                org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
                android.useAndroidX=true
                android.nonTransitiveRClass=true
            - file_name: gradle.properties
      - set-java-version@1:
          inputs:
            - set_java_version: 17
      - install-missing-android-tools@3:
          inputs:
            - gradlew_path: $PROJECT_LOCATION/gradlew
      - gradle-runner@2:
          inputs:
            - app_file_exclude_filter: |
                *unaligned.apk
                *Test*.apk
                */intermediates/*
                *unasigned.apk
                *aligned.apk*
            - gradle_task: $GRADLE_TASK
      - sign-apk@1:
          inputs:
            - debuggable_permitted: false
            - android_app: $BITRISE_APK_PATH_LIST\n$BITRISE_AAB_PATH_LIST\n$BITRISE_TEST_APK_PATH
            - use_apk_signer: true
      - cache-push@2: {}
      - deploy-to-bitrise-io@2: {}
  assembleAllAPKS:
    before_run:
      - assemble
    envs:
      - opts:
          is_expand: false
        DEBUG_VARIANT: firebaseLiveApiLiveDebug
      - opts:
          is_expand: false
        RELEASE_VARIANT: firebaseLiveApiLiveRelease
      - opts:
          is_expand: false
        GRADLE_TASK: |-
          assembleRelease
          bundleRelease
  assembleDevAPKS:
    before_run:
      - assemble
    envs:
      - opts:
          is_expand: false
        DEBUG_VARIANT: firebaseDevApiDevDebug
      - opts:
          is_expand: false
        RELEASE_VARIANT: firebaseDevApiDevRelease
      - opts:
          is_expand: false
        GRADLE_TASK: |-
          assembleFirebaseDevApiDevRelease
          bundleFirebaseDevApiDevRelease
  assembleProdAPKS:
    before_run:
      - assemble
    envs:
      - opts:
          is_expand: false
        DEBUG_VARIANT: firebaseLiveApiLiveDebug
      - opts:
          is_expand: false
        RELEASE_VARIANT: firebaseLiveApiLiveRelease
      - opts:
          is_expand: false
        GRADLE_TASK: |-
          assembleFirebaseLiveApiLiveRelease
          bundleFirebaseLiveApiLiveRelease
  assembleStagingAPKS:
    before_run:
      - assemble
    envs:
      - opts:
          is_expand: false
        DEBUG_VARIANT: firebaseStagingApiStagingDebug
      - opts:
          is_expand: false
        RELEASE_VARIANT: firebaseStagingApiStagingRelease
      - opts:
          is_expand: false
        GRADLE_TASK: |-
          assembleFirebaseStagingApiStagingRelease
          bundleFirebaseStagingApiStagingRelease
meta:
  bitrise.io:
    stack: osx-xcode-15.3.x
    machine_type_id: g2.mac.large
app:
  envs:
    - opts:
        is_expand: false
      PROJECT_LOCATION: .
    - opts:
        is_expand: false
      MODULE: app
    - opts:
        is_expand: false
      GRADLEW_PATH: ./gradlew
trigger_map:
  - push_branch: release/*
    workflow: assembleStagingAPKS
  - push_branch: hotfix/*
    workflow: assembleProdAPKS
  - push_branch: develop
    workflow: assembleDevAPKS