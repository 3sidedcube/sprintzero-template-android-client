# Template for the gitignored secret.properties.
#
# Setup: cp secret-examples.properties secret.properties
# then replace the placeholder values with the real ones (from 1Password / the CI vault).
#
# The build falls back to this file when secret.properties is absent, so fresh clones
# and CI keep building with placeholder values. Never put real secrets in this file —
# it is committed. Add one row per secret and wire it into app/build.gradle.kts as a
# buildConfigField alongside EXAMPLE_API_KEY.
EXAMPLE_API_KEY=example-api-key-goes-here
