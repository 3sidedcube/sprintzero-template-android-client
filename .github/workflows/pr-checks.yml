name: PR Checks

on:
  pull_request:
  push:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create CI gradle.properties
        run: |
          cat > gradle.properties << 'PROPS'
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          PROPS

      - name: ktlint
        run: ./gradlew ktlint

      - name: Unit tests
        run: ./gradlew testFirebaseStagingApiStagingDebugUnitTest

      - name: Android Lint
        run: ./gradlew lintFirebaseStagingApiStagingDebug

      - name: Assemble debug
        run: ./gradlew assembleFirebaseStagingApiStagingDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
