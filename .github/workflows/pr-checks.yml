name: PR Checks

on:
  pull_request:
  push:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # AGP refuses to configure without android.useAndroidX, so CI still needs a
      # minimal gradle.properties even though only ktlint runs
      - name: Create CI gradle.properties
        run: |
          cat > gradle.properties << 'PROPS'
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          PROPS

      - name: ktlint
        run: ./gradlew ktlint
