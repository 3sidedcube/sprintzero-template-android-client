version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      androidx:
        patterns: ["androidx.*"]
      firebase:
        patterns: ["com.google.firebase*", "com.google.gms*"]
      kotlin-toolchain:
        patterns: ["com.android.*", "com.google.devtools.ksp*", "com.google.dagger*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
